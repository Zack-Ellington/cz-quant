[project]
name = "kalshi-calibration"
version = "0.1.0"
description = "How well do Kalshi prices predict outcomes? A calibration study of two-outcome events."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "numpy>=1.26", "scipy>=1.11"]

[project.scripts]
calibration = "calibration.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calibration"]

[tool.uv]
link-mode = "copy"
