[project]
name = "draftkings-research"
version = "0.1.0"
description = "Read-only sportsbook odds collection for research"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8", "basedpyright>=1.30"]

[tool.basedpyright]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
exclude = ["tests", ".venv"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.uv]
package = false
link-mode = "copy"
