[project]
name = "cz-quant-scripts"
version = "0.1.0"
description = "Reporting across strategies from the runs/ ledgers: one CSV, a P&L table, and a P&L plot."
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "plotly>=5.24",
]

[project.scripts]
pnl = "pnl:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["pnl.py"]

[tool.uv]
# OneDrive and some synced folders reject the hardlinks uv uses by default,
# which leaves a half-installed .venv. Copying always works.
link-mode = "copy"
