[project]
name = "kalshi-sum-check-unwind"
version = "0.1.0"
description = "Kalshi sum check paper trader that unwinds the unhedged legs of a partially filled basket."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "czquant",
    "websockets>=13",
    "cryptography>=42",
]

[tool.uv]
# Plain scripts with a local copy of the kalshi_sum_check engine, not an installable package.
package = false
# OneDrive rejects the hardlinks uv uses by default, which leaves a half-built .venv.
link-mode = "copy"

[tool.uv.sources]
czquant = { path = "../../packages/czquant", editable = true }

[dependency-groups]
dev = ["pytest>=8", "basedpyright>=1.30"]

[tool.basedpyright]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
exclude = ["tests", ".venv"]

[tool.pytest.ini_options]
pythonpath = ["."]
