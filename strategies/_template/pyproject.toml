[project]
name = "strategy-template"
version = "0.1.0"
description = "TODO: one-line description of the strategy."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
strategy = "strategy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strategy"]

[tool.uv]
# OneDrive and some synced folders reject the hardlinks uv uses by default,
# which leaves a half-installed .venv. Copying always works.
link-mode = "copy"
