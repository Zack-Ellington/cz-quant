[project]
name = "wcbb-favorites"
version = "0.1.0"
description = "Paper-buys the favored team in Kalshi women's college basketball games inside a calibrated price range."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "czquant",
    "httpx>=0.27",
]

[project.scripts]
strategy = "strategy.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strategy"]

[tool.uv]
# OneDrive and some synced folders reject the hardlinks uv uses by default,
# which leaves a half-installed .venv. Copying always works.
link-mode = "copy"

[tool.uv.sources]
czquant = { path = "../../packages/czquant", editable = true }
