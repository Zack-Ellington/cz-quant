[project]
name = "2026-midterm-prediction-arbitrage"
version = "0.1.0"
description = "Independent-race model of 2026 Congress control vs. Kalshi's combo market, with paper trading."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
]

[project.scripts]
strategy = "strategy.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strategy"]
