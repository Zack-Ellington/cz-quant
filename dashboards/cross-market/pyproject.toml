[project]
name = "cross-market-dashboard"
version = "0.1.0"
description = "Read-only Flask view of cross-market experiments in the shared economic log."
requires-python = ">=3.12"
dependencies = ["czquant", "flask>=3.0"]

[tool.uv]
package = false
# OneDrive rejects the hardlinks uv uses by default.
link-mode = "copy"

[tool.uv.sources]
czquant = { path = "../../packages/czquant", editable = true }
