<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cross-market experiments</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1b1f24; --muted: #5d6673; --line: #e3e6ea;
    --pos: #1a7f4b; --neg: #b42318; --accent: #2f5bd3; --win: rgba(26,127,75,.13); --trade: #1a7f4b;
    --warn-bg: #fff4e5; --warn: #8a4b00; --chip: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --panel: #191d22; --ink: #e7eaee; --muted: #9aa4b1; --line: #2a3038;
      --pos: #4cc38a; --neg: #ff7b72; --accent: #7aa2ff; --win: rgba(76,195,138,.16); --trade: #4cc38a;
      --warn-bg: #3a2a12; --warn: #ffc27a; --chip: #232931; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { padding: 18px 24px 8px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px 20px; }
  h1 { font-size: 18px; margin: 0; font-weight: 650; }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }
  main { padding: 8px 24px 40px; display: grid; gap: 16px; }
  .tabs button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    padding: 4px 12px; border-radius: 6px; cursor: pointer; }
  .tabs button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .summary { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
  .tile .label { font-size: 12px; color: var(--muted); }
  .tile .value { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .card h2 { font-size: 16px; margin: 0; }
  .head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 10px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 1px 9px; font-size: 12px; color: var(--muted); }
  .chip.live { color: var(--neg); } .chip.ok { color: var(--pos); }
  .halt { background: var(--warn-bg); color: var(--warn); border-radius: 6px; padding: 6px 10px; margin: 6px 0; font-size: 13px; }
  .grid { display: grid; grid-template-columns: minmax(280px, 1fr) minmax(320px, 1.4fr); gap: 14px 22px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 12px 0 6px; font-weight: 600; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-weight: 600; font-size: 12px; color: var(--muted); }
  td.r, th.r { text-align: right; }
  .pos { color: var(--pos); } .neg { color: var(--neg); }
  .scroll { max-height: 220px; overflow: auto; }
  .gapbig { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  svg text { fill: var(--muted); font-size: 11px; }
  .empty { color: var(--muted); font-style: italic; padding: 4px 0; }
  code.err { font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; color: var(--neg);
    background: var(--chip); border-radius: 4px; padding: 1px 5px; display: inline-block; margin: 1px 0; white-space: normal; }
  td.wrap { white-space: normal; }
</style>
</head>
<body>
<header>
  <h1>Cross-market experiments</h1>
  <span class="tabs" role="group" aria-label="Mode">
    <button data-mode="all" aria-pressed="true">All</button>
    <button data-mode="live" aria-pressed="false">Live</button>
    <button data-mode="paper" aria-pressed="false">Paper</button>
  </span>
  <span class="muted" id="status">Loading…</span>
</header>
<main>
  <section class="summary" id="summary" aria-label="Overall totals"></section>
  <div id="cards"></div>
</main>
<script>
let mode = "all";
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const time = (t) => t ? new Date(t).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"}) : "–";
const usd = (v) => v == null ? "–" : (Number(v) < 0 ? "−$" : "$") + Math.abs(Number(v)).toFixed(2);
const cents = (v) => v == null ? "–" : (Number(v) * 100).toFixed(2) + "¢";
const sign = (v) => v == null ? "" : Number(v) > 0 ? "pos" : Number(v) < 0 ? "neg" : "";
// The strategy's own verdict on a scan, in words. Gaps above are before fees.
const WHY = {ok: "tradable", no_edge: "fees exceed gap", below_min_edge: "profit after fees < min_edge or min_net",
  below_risk_free: "below return hurdle", above_max_apr: "above max_apr", capital_limit: "capped by cash/limits",
  no_cash: "no cash", no_depth: "no depth", kalshi_not_trading: "Kalshi closed", polymarket_not_trading: "Polymarket closed",
  unsupported_kalshi_fees: "unsupported Kalshi fees"};
const why = (w) => Object.entries(w.reasons || {}).sort((a, b) => b[1] - a[1]).map(([r, n]) => `${WHY[r] || r}${n > 1 ? ` ×${n}` : ""}`).join(", ");
const dur = (s) => s >= 60 ? `${Math.floor(s / 60)}m ${s % 60}s` : `${s}s`;

document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => {
  mode = b.dataset.mode;
  document.querySelectorAll(".tabs button").forEach((x) => x.setAttribute("aria-pressed", x === b));
  render(window.lastState);
}));

function tile(label, value, cls = "") {
  return `<div class="tile"><div class="label">${esc(label)}</div><div class="value ${cls}">${value}</div></div>`;
}

function chart(series, windows) {
  const pts = series.filter((p) => p.gap != null);
  if (pts.length < 2) return `<div class="empty">Waiting for two-sided quotes on both venues.</div>`;
  const W = 640, H = 150, L = 44, R = 8, T = 10, B = 20;
  const t0 = new Date(pts[0].t).getTime(), t1 = new Date(pts[pts.length - 1].t).getTime() || t0 + 1;
  const gaps = pts.map((p) => Number(p.gap));
  let lo = Math.min(...gaps, -0.01), hi = Math.max(...gaps, 0.01);
  const pad = (hi - lo) * 0.1; lo -= pad; hi += pad;
  const x = (t) => L + (W - L - R) * ((new Date(t).getTime() - t0) / Math.max(1, t1 - t0));
  const y = (g) => T + (H - T - B) * (1 - (g - lo) / (hi - lo));
  const shade = windows.map((w) => {
    const a = x(w.start), b = Math.max(x(w.end), a + 2);
    return `<rect x="${a}" y="${T}" width="${b - a}" height="${H - T - B}" fill="var(--win)"><title>Gap window ${time(w.start)}–${time(w.end)}, ${dur(w.duration_s)}, max ${cents(w.max_gap)}</title></rect>`;
  }).join("");
  const line = pts.map((p, i) => `${i ? "L" : "M"}${x(p.t).toFixed(1)},${y(Number(p.gap)).toFixed(1)}`).join("");
  const trades = pts.filter((p) => p.tradable).map((p) => `<circle cx="${x(p.t)}" cy="${y(Number(p.gap))}" r="3" fill="var(--trade)"><title>Tradable basket ${time(p.t)}</title></circle>`).join("");
  const zero = y(0);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Price gap over time">
    ${shade}
    <line x1="${L}" x2="${W - R}" y1="${zero}" y2="${zero}" stroke="var(--line)" stroke-dasharray="3 3"/>
    <text x="${L - 6}" y="${zero + 4}" text-anchor="end">0¢</text>
    <text x="${L - 6}" y="${T + 9}" text-anchor="end">${(hi * 100).toFixed(1)}¢</text>
    <text x="${L - 6}" y="${H - B}" text-anchor="end">${(lo * 100).toFixed(1)}¢</text>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
    ${trades}
    <text x="${L}" y="${H - 4}">${time(pts[0].t)}</text>
    <text x="${W - R}" y="${H - 4}" text-anchor="end">${time(pts[pts.length - 1].t)}</text>
  </svg>`;
}

function card(e) {
  const latest = e.latest;
  const quotes = latest?.quotes ?? [];
  const bestKeys = new Set((latest?.best ?? []).map((q) => q.role + q.venue));
  const outcomeName = (role) => { const o = e.pair.outcomes[Number(role)]; return o ? o.kalshi.split("-").pop() : role; };
  const quoteRows = quotes.length ? quotes.map((q) => `<tr><td>${esc(outcomeName(q.role))}</td><td>${esc(q.venue === "kalshi" ? "Kalshi" : "Polymarket US")}</td><td>${esc(q.contract)}</td>
      <td class="r ${bestKeys.has(q.role + q.venue) ? "pos" : ""}">${q.ask == null ? "–" : cents(q.ask)}</td><td class="r">${q.size == null ? "–" : Number(q.size).toLocaleString()}</td></tr>`).join("")
    : `<tr><td colspan="5" class="empty">${esc(latest?.reason ?? "No scan yet")}</td></tr>`;
  const cashRows = e.cash.map((c) => `<tr><td>${esc(c.venue === "kalshi" ? "Kalshi" : "Polymarket US")}<div class="muted" style="font-size:12px">${esc(c.pool)}</div></td>
      <td class="r">${usd(c.funded)}</td><td class="r">${usd(c.cash)}</td><td class="r">${usd(c.reserved)}</td><td class="r">${usd(c.available)}</td><td class="r">${c.open_lots}</td></tr>`).join("");
  const winRows = e.windows.slice().reverse().map((w) => `<tr><td>${time(w.start)}</td><td class="r">${dur(w.duration_s)}</td><td class="r pos">${cents(w.max_gap)}</td>
      <td class="r">${w.tradable ? usd(w.max_net) : "–"}</td><td class="r">${w.tradable ? w.max_sets : "–"}</td><td>${w.tradable ? '<span class="pos">tradable</span>' : `<span class="muted">${esc(why(w))}</span>`}</td></tr>`).join("");
  const attemptRows = e.attempts.slice().reverse().map((a) => `<tr><td>${time(a.t)}</td><td>${esc(a.trade_id)}</td><td class="r">${esc(a.sets)}</td><td class="r">${usd(a.expected_net)}</td>
      <td>${a.outcomes.map((o) => esc(`${o.venue ?? ""} ${o.status ?? ""} ${o.filled ?? o.sold ?? ""}`.trim())).join(" · ")}</td></tr>`).join("");
  const tradeRows = e.executed.slice().reverse().map((t) => `<tr><td>${time(t.t)}</td><td>${esc(t.trade_id)}</td>
      <td>${t.legs.map((l) => esc(`${l.venue === "kalshi" ? "K" : "PM"} ${l.side.toUpperCase()} ${l.qty}@${Number(l.price).toFixed(3)}`)).join(" · ")}</td>
      <td class="r">${esc(t.open_sets)}</td><td class="r">${usd(t.fees)}</td><td class="r ${sign(t.expected_profit)}">${usd(t.expected_profit)}</td><td>${!t.basket ? '<span class="neg">one leg filled, sold back</span>' : t.unwound ? "repaired" : t.complete ? "complete" : "partial"}</td></tr>`).join("");
  const missedRows = (e.missed || []).slice().reverse().map((m) => `<tr><td>${time(m.start)}</td><td class="r">${m.duration_s ? dur(m.duration_s) : "1 scan"}</td>
      <td class="r pos">${usd(m.max_net)}</td><td class="r">${esc(m.sets ?? "–")}</td><td class="r">${m.edge == null ? "–" : cents(m.edge)}</td>
      <td class="wrap">${m.errors.map((x) => `<code class="err">${esc(x)}</code>`).join(" ")}</td></tr>`).join("");
  const hb = e.heartbeat;
  const stale = !hb || (Date.now() - new Date(hb.t).getTime()) > 120000;
  const gap = latest?.gap;
  return `<article class="card" aria-label="${esc(e.id)}">
    <div class="head">
      <h2>${esc(e.pair.kalshi_event.replace("KXNFLGAME-", ""))}</h2>
      <span class="chip ${e.mode === "live" ? "live" : ""}">${esc(e.mode)}${e.dry_run ? " · dry run" : ""}</span>
      <span class="chip">${esc(e.id)}</span>
      <span class="chip ${stale ? "" : "ok"}">${stale ? "no heartbeat" : "running"} · ${time(hb?.t)}</span>
      <span class="muted">kickoff ${time(e.pair.start)} · est. payout ${time(e.pair.resolves_at)}</span>
    </div>
    ${e.halts.map((h) => `<div class="halt">Halted ${time(h.t)}: ${esc(h.reason)}</div>`).join("")}
    <div class="grid">
      <div>
        <h3>Gap now (1 − cheapest asks, before fees)</h3>
        <div class="gapbig ${sign(gap)}">${gap == null ? "–" : cents(gap)}</div>
        <div class="muted" style="font-size:12px">Last scan ${time(latest?.t)} · ${esc(latest?.reason ?? "")}</div>
        <h3>Leg prices</h3>
        <table><thead><tr><th>Outcome</th><th>Venue</th><th>Buys</th><th class="r">Ask</th><th class="r">Size</th></tr></thead><tbody>${quoteRows}</tbody></table>
        <h3>Cash</h3>
        <table><thead><tr><th>Pool</th><th class="r">Funded</th><th class="r">Cash</th><th class="r">Reserved</th><th class="r">Available</th><th class="r">Lots</th></tr></thead><tbody>${cashRows}</tbody></table>
      </div>
      <div>
        <h3>Gap history (before fees) · shaded: positive gap · dots: basket passed fees and filters</h3>
        ${chart(e.series, e.windows)}
        <h3>Opportunity windows (${e.windows.length})</h3>
        <div class="scroll">${winRows ? `<table><thead><tr><th>Opened</th><th class="r">Lasted</th><th class="r">Max gap</th><th class="r">Max net</th><th class="r">Sets</th><th>Not traded because</th></tr></thead><tbody>${winRows}</tbody></table>` : '<div class="empty">None yet: a set has cost at least $1 at every scan.</div>'}</div>
      </div>
    </div>
    <h3>Unfilled opportunities (${e.totals.missed} · ${usd(e.totals.missed_potential)} potential)</h3>
    <div class="scroll">${missedRows ? `<table><thead><tr><th>Found</th><th class="r">Lasted</th><th class="r">Potential</th><th class="r">Sets</th><th class="r">Edge/set</th><th>Why it wasn't filled</th></tr></thead><tbody>${missedRows}</tbody></table>` : '<div class="empty">None: every basket that passed the filters was filled.</div>'}</div>
    <div class="grid">
      <div><h3>Trade attempts (${e.attempts.length})</h3><div class="scroll">${attemptRows ? `<table><thead><tr><th>Time</th><th>Trade</th><th class="r">Sets</th><th class="r">Expected</th><th>Legs</th></tr></thead><tbody>${attemptRows}</tbody></table>` : '<div class="empty">No attempts.</div>'}</div></div>
      <div><h3>Fills (${e.totals.executed} baskets, ${e.totals.repaired} repaired legs)</h3><div class="scroll">${tradeRows ? `<table><thead><tr><th>Time</th><th>Trade</th><th>Fills</th><th class="r">Open sets</th><th class="r">Fees</th><th class="r">Expected P&amp;L</th><th></th></tr></thead><tbody>${tradeRows}</tbody></table>` : '<div class="empty">No fills.</div>'}</div></div>
    </div>
  </article>`;
}

function render(state) {
  if (!state) return;
  const shown = state.experiments.filter((e) => mode === "all" || e.mode === mode);
  const modes = mode === "all" ? Object.keys(state.overall) : [mode];
  const agg = {experiments: 0, funded: 0, cash: 0, available: 0, attempts: 0, executed: 0, repaired: 0, expected_profit: 0, missed: 0, missed_potential: 0};
  modes.forEach((m) => { const o = state.overall[m]; if (!o) return; for (const k in agg) agg[k] += Number(o[k]); });
  $("#summary").innerHTML = tile("Experiments", agg.experiments) + tile("Funded", usd(agg.funded)) + tile("Cash", usd(agg.cash))
    + tile("Available", usd(agg.available)) + tile("Trade attempts", agg.attempts) + tile("Executed baskets", agg.executed) + tile("Repaired legs", agg.repaired)
    + tile("Realized + expected P&L", usd(agg.expected_profit), sign(agg.expected_profit))
    + tile("Unfilled opportunities", agg.missed) + tile("Missed potential", usd(agg.missed_potential));
  $("#cards").innerHTML = shown.length ? shown.map(card).join("") : '<div class="card empty">No experiments recorded yet.</div>';
}

async function refresh() {
  try {
    const r = await fetch("/api/state", {cache: "no-store"});
    if (!r.ok) throw new Error(r.status);
    window.lastState = await r.json();
    render(window.lastState);
    $("#status").textContent = `Updated ${time(window.lastState.generated_at)} · refreshes about every 10 s`;
  } catch (err) {
    $("#status").textContent = `Update failed (${err.message}); retrying`;
  }
}
async function loop() { await refresh(); setTimeout(loop, 5000); }  // never overlaps
loop();
</script>
</body>
</html>
